# ======================= ГРУППА BUILD_WORKS ================================
# ВНИМАНИЕ (ПП РФ № 2571, доп. требования — опыт исполнения аналогичного контракта):
#   позиции 14–15 (капитальный и текущий ремонт) — с НМЦК от 1 млн ₽;
#   позиция 16 (прочие строительные работы)      — с НМЦК от 500 тыс. ₽.
# Поэтому у работ ДВА коридора:
#   corridor_nodocs: до 1 000 000 ₽ (капремонт/текущий ремонт) / до 500 000 ₽ (прочие)
#   corridor_experience: 1–3 млн ₽ — нужен закрытый аналогичный контракт у Артёма/подрядчика.
# Членство в СРО для стройподряда не требуется, если цена договора ≤ 10 млн ₽ (ч. 2.1 ст. 52 ГрК).
# Все фильтры работ: object_type «работы» (и «услуги» там, где указано), только ЦФО.

