# ---------------------------------------------------------------------------
defaults:
  price_min: null            # нижней границы нет — решение владельца
  price_max: 3000000         # единый потолок; менять ТОЛЬКО здесь
  price_max_soft: 2500000    # альтернативное значение потолка (переключатель)
  object_type: "товары"
  regions_preset: "CORE"
  exclusion_presets: ["SERVICE_BASE"]
  status: "active"

# Правила матчинга (обязательны к реализации, см. ТЗ разд. 4)
matching:
  normalize_yo: true          # ё -> е с обеих сторон сравнения
  normalize_case: true        # всё в нижний регистр
  collapse_whitespace: true   # множественные пробелы/дефисы -> один пробел
  match_mode: "substring_word_boundary"   # подстрока, но с границами слова
  keyword_wins_over_exclusion: true       # исключение игнорируется, если оно является частью сработавшего ключевика
  search_fields: ["наименование объекта закупки", "наименования позиций (спецификация)"]

